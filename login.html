<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>লগইন — হিসাব খাতা</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="login-wrap">
  <div class="login-card">
    <h1>হিসাব খাতা</h1>
    <p class="sub">আপনার ব্যবসার হিসাব — নিরাপদ ও ব্যক্তিগত</p>

    <div class="field">
      <label for="email">ইমেইল</label>
      <input type="email" id="email" placeholder="you@example.com" autocomplete="username">
    </div>
    <div class="field">
      <label for="password">পাসওয়ার্ড</label>
      <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">
    </div>
    <button class="btn btn-primary" id="loginBtn">প্রবেশ করুন</button>
    <p class="error-text" id="errMsg"></p>
  </div>
</div>

<script type="module">
import { auth } from "./js/firebase-config.js";
import { signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";

onAuthStateChanged(auth, (user) => {
  if (user) window.location.href = "index.html";
});

document.getElementById("loginBtn").addEventListener("click", async () => {
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  const errEl = document.getElementById("errMsg");
  errEl.textContent = "";
  if (!email || !password){
    errEl.textContent = "ইমেইল ও পাসওয়ার্ড দিন";
    return;
  }
  try{
    await signInWithEmailAndPassword(auth, email, password);
    window.location.href = "index.html";
  } catch(e){
    eerrEl.textContent = e.code + " — " + e.message;
  }
});
</script>
</body>
</html>
